name: tastip
services:
  web:
    image: ${TASTIP_IMAGE:-tastip:local}
    build:
      context: ..
      dockerfile: Dockerfile
    user: "1000:1000"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - path: ${TASTIP_RUNTIME_ENV_FILE:?Set an absolute runtime env file outside the checkout}
        required: true
        format: raw
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      TASTIP_INTERNAL_ORIGIN: "${TASTIP_FORWARDED_PROTO:-http}://0.0.0.0:3000"
      TASTIP_DATA_DIR: /data
    expose:
      - "3000"
    volumes:
      - private_data:/data
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700,size=64m
      - /app/apps/web/.next/cache:uid=1000,gid=1000,mode=0700,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: ${TASTIP_PROXY_IMAGE:-tastip-proxy:local}
    build:
      context: ..
      dockerfile: deploy/proxy.Dockerfile
    user: "1000:1000"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      web:
        condition: service_healthy
    environment:
      # Set https only when the trusted outer proxy serves the public HTTPS origin.
      TASTIP_FORWARDED_PROTO: ${TASTIP_FORWARDED_PROTO:-http}
    ports:
      - target: 8080
        published: "${TASTIP_BIND_PORT:-3000}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700,size=16m
      - /data:uid=1000,gid=1000,mode=0700,size=16m
      - /config:uid=1000,gid=1000,mode=0700,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  private_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${TASTIP_DATA_HOST_DIR:?Set an absolute private directory on the persistent host volume}
